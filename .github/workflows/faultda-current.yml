name: FaultDA current evidence acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - run: mkdir -p work
      - run: python -m unittest tests.test_faultda_semantics305 tests.test_faultda_semantics305_acceptance tests.test_faultda_consistency310 tests.test_faultda_feedback315 tests.test_faultda_feedback315_acceptance tests.test_faultda_handoff320 tests.test_faultda_handoff320_acceptance tests.test_faultda_recover325 tests.test_faultda_recover325_acceptance tests.test_faultda_qualify330 tests.test_faultda_qualify330_acceptance tests.test_faultda_runtime335 tests.test_faultda_runtime335_acceptance tests.test_faultda_live350 tests.test_faultda_live350_acceptance tests.test_faultda_state355 tests.test_faultda_state355_acceptance tests.test_faultda_stop360 tests.test_faultda_stop360_acceptance tests.test_faultda_goal365 tests.test_faultda_goal365_acceptance tests.test_faultda_responsibility370 tests.test_faultda_responsibility370_acceptance tests.test_faultda_lineage375 tests.test_faultda_lineage375_acceptance tests.test_faultda_receipt380 tests.test_faultda_receipt380_acceptance tests.test_faultda_postreceipt385 tests.test_faultda_postreceipt385_review tests.test_faultda_postreceipt385_acceptance tests.test_faultda_probes390 tests.test_faultda_probes390_review tests.test_faultda_probes390_acceptance tests.test_faultda_coherent395 tests.test_faultda_coherent395_pilot tests.test_faultda_coherent395_review tests.test_faultda_coherent395_acceptance tests.test_faultda_validity500 tests.test_faultda_validity500_review tests.test_faultda_validity500_acceptance -v
      - run: python -m faultda_bench.validity500.audit --output work/faultda_current_acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: faultda-current-evidence-acceptance
          path: work/faultda_current_acceptance.json
