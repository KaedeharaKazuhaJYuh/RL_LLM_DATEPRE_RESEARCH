name: FaultDA current evidence acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require complete audit history
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - uses: actions/setup-python@v5
        id: py312
        with:
          python-version: '3.12'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: mkdir -p work
      - run: python -m faultda_bench.current_evidence --list
      - run: python -m faultda_bench.current_evidence --run-tests --verbose
        env:
          VERICOST_PY312: ${{ steps.py312.outputs.python-path }}
      - run: python -m faultda_bench.current_evidence --run-audits
      - uses: actions/upload-artifact@v4
        with:
          name: faultda-current-evidence-acceptance
          path: |
            work/faultda_current_acceptance.json
            work/faultda_termination555_acceptance.json
            work/stats560.json
            work/stats560.md
            work/faultda_release560_acceptance.json
            work/faultda_ci565_acceptance.json
