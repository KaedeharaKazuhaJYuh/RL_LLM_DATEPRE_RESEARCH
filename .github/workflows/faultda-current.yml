name: FaultDA current evidence acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: mkdir -p work
      - run: python -m faultda_bench.current_evidence --list
      - run: python -m faultda_bench.current_evidence --run-tests --verbose
      - run: python -m faultda_bench.current_evidence --run-audits
      - uses: actions/upload-artifact@v4
        with:
          name: faultda-current-evidence-acceptance
          path: |
            work/faultda_current_acceptance.json
            work/faultda_termination555_acceptance.json
            work/stats560.json
            work/stats560.md
            work/faultda_release560_acceptance.json
