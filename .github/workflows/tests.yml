name: V2 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - run: python -m unittest discover -s tests -v
      - run: python -m research.benchmark
      - run: git diff --exit-code -- tasks/v2 data/variants/value_v1 tasks/variants/value_v1/data
