[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-llm-data-agent"
version = "5.0.15b2"
description = "Verifiable RL and LLM data-analysis research with optional native tools and local experiment orchestration"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["agent*", "research*", "experiments*", "verifier*", "scripts*", "faultda_bench*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
